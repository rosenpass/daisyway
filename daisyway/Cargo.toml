[package]
name = "daisyway"
version = "0.1.0"
edition = "2021"
homepage = "https://rosenpass.eu"
description = "ETSI-014 adapter for WireGuard (Create WireGuard connections secured by quantum key distribution)"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
anyhow = "1.0"
base64ct = { version = "1.6.0" }
clap = { version = "4.5.31", features = ["derive"] }
clap_complete = "4.5.46"
clap_mangen = "0.3"
env_logger = "0.11.6"
log = "0.4.25"
rand = "0.10"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
sha3 = "0.12"
tokio = { version = "1", features = ["full"] }
toml = "1.1"
uuid = { version = "1.13.1", features = ["serde"] }
zerocopy = { version = "0.8.17", features = ["derive"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1.11.0"
wireguard-uapi = "3.0.0"
shadow-rs = { version = "2.0", default-features = false }

[build-dependencies]
shadow-rs = { version = "2.0" }
