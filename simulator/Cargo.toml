[package]
name = "simulator"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
base64ct = "1.7"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11.7"
http-body-util = "0.1.3"
hyper = { version = "1.6", features = ["full", "http1", "server"] }
hyper-rustls = "0.27.5"
hyper-util = "0.1.10"
log = "0.4.26"
rustls = "0.23"
rustls-pki-types = "1.11"
serde_json = "1.0"
tokio = { version = "1.44", features = ["full"] }
# tokio-native-tls = "0.3.1"
tokio-rustls = "0.26.2"
tokio-stream = "0.1.17"
uuid = { version = "1.16", features = ["v4"] }
# tokio-native-tls = "0.3.1"
# rustls-pemfile = "2.2"
